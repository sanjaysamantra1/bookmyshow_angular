<!-- BookMyShow Carousel Component (Bootstrap 5) -->
<div id="bmsCarousel" class="carousel slide bms-carousel" data-bs-ride="carousel">

  <!-- Indicators -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#bmsCarousel" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#bmsCarousel" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#bmsCarousel" data-bs-slide-to="2"></button>
  </div>

  <!-- Slides -->
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="images/carousel-1.png" class="d-block w-100" alt="Movie Banner 1">
    </div>
    <div class="carousel-item">
      <img src="images/carousel-2.png" class="d-block w-100" alt="Movie Banner 2">
    </div>
    <div class="carousel-item">
      <img src="images/carousel-3.png" class="d-block w-100" alt="Movie Banner 3">
    </div>
     <div class="carousel-item">
      <img src="images/carousel-4.png" class="d-block w-100" alt="Movie Banner 3">
    </div>
  </div>

  <!-- Controls -->
  <button class="carousel-control-prev" type="button" data-bs-target="#bmsCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#bmsCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
