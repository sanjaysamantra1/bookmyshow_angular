<nav class="bms-header">
  <div class="container-fluid px-3">
    <div class="d-flex align-items-center gap-3">

      <!-- Logo -->
      <a class="header-logo flex-shrink-0" routerLink="/">
        <img src="images/bms-logo.png" alt="BookMyShow" height="34">
      </a>

      <!-- Search -->
      <div class="header-search flex-grow-1 d-none d-md-flex">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="Search for Movies, Events, Plays, Sports and Activities">
      </div>

      <!-- Right controls -->
      <div class="d-flex align-items-center gap-2 flex-shrink-0">

        <!-- City picker -->
        <button class="city-btn d-none d-md-flex">
          <span class="city-name">Bengaluru</span>
          <span class="city-caret">▾</span>
        </button>

        @if (auth.isLoggedIn()) {
          <!-- Logged-in user dropdown -->
          <div class="user-menu-wrap">
            <button class="user-btn" (click)="toggleDropdown()">
              <span class="user-avatar">{{ auth.currentUser()?.name?.charAt(0)?.toUpperCase() }}</span>
              <span class="user-name d-none d-md-inline">{{ auth.currentUser()?.name }}</span>
              <span class="city-caret">▾</span>
            </button>
            @if (dropdownOpen) {
              <div class="user-dropdown">
                <div class="dropdown-user-info">
                  <span class="dropdown-avatar">{{ auth.currentUser()?.name?.charAt(0)?.toUpperCase() }}</span>
                  <div>
                    <p class="dropdown-name">{{ auth.currentUser()?.name }}</p>
                    <p class="dropdown-email">{{ auth.currentUser()?.email }}</p>
                  </div>
                </div>
                <hr class="dropdown-divider">
                <a routerLink="/bookings" class="dropdown-item-link" (click)="dropdownOpen=false">
                  🎟️ My Bookings
                </a>
                <a routerLink="/" class="dropdown-item-link" (click)="dropdownOpen=false">
                  ⚙️ Settings
                </a>
                <hr class="dropdown-divider">
                <button class="dropdown-logout" (click)="onLogout()">
                  🚪 Sign Out
                </button>
              </div>
            }
          </div>
        } @else {
          <a routerLink="/login" class="btn-signin">Sign in</a>
        }

      </div>
    </div>
  </div>
</nav>
